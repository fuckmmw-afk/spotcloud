name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic tests (filter, dedup, models)
        run: |
          clang -fobjc-arc -Wall -framework Foundation -ISources/SoundCloud Tests/SCLogicTests.m \
            Sources/SoundCloud/SCModels.m Sources/SoundCloud/SCFilter.m Sources/SoundCloud/SCDedup.m -o spotcloud-tests
          ./spotcloud-tests

  dylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make perl git xz-utils

      - name: Install Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -a "$RUNNER_TEMP/sdks/." "$RUNNER_TEMP/theos/sdks/"
          mkdir -p "$RUNNER_TEMP/theos/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP/theos/toolchain"

      - name: xcrun shim for libjamesdsp
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/xcrun" <<EOS
          #!/bin/sh
          case "\$*" in
            *"--find clang"*) echo "$RUNNER_TEMP/theos/toolchain/linux/iphone/bin/clang" ;;
            *"--find libtool"*) echo "$RUNNER_TEMP/theos/toolchain/linux/iphone/bin/libtool" ;;
            *"--show-sdk-path"*) echo "$RUNNER_TEMP/theos/sdks/iPhoneOS16.5.sdk" ;;
            *) echo "unsupported xcrun invocation: \$*" >&2; exit 1 ;;
          esac
          EOS
          chmod +x "$RUNNER_TEMP/bin/xcrun"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build SpotCloud.dylib
        env:
          THEOS: ${{ runner.temp }}/theos
        run: make -j4 FINALPACKAGE=1 SPOTCLOUD_VERSION="0.1.2-${GITHUB_SHA::7}"

      - name: Check the dylib
        run: |
          OTOOL="$RUNNER_TEMP/theos/toolchain/linux/iphone/bin/otool"
          "$OTOOL" -L .theos/obj/SpotCloud.dylib
          ! "$OTOOL" -L .theos/obj/SpotCloud.dylib | grep -qi substrate
          mkdir -p artifact
          cp .theos/obj/SpotCloud.dylib Scripts/patch_spotifyglass.py artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: SpotCloud-dylib
          path: artifact/
